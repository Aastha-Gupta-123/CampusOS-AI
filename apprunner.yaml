version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn app:app --host 0.0.0.0 --port 8080 --workers 2
  network:
    port: 8080
    env: PORT
  env:
    - name: LOG_LEVEL
      value: INFO
    - name: GROQ_MODEL
      value: llama3-8b-8192
