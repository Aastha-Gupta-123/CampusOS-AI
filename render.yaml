services:
  - type: web
    name: campusmate-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 2
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: GROQ_MAX_TOKENS
        value: "4096"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/database/campus_agent.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://campusmate-ai.vercel.app
      - key: CORS_ORIGINS
        value: https://campusmate-ai.vercel.app,http://localhost:3000
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: campusmate-db
      mountPath: /opt/render/project/src/database
      sizeGB: 1
